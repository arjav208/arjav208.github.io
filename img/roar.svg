<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ROAR — AI fan segmentation</title>
  <desc id="description">A sports audience segmentation concept showing a natural-language prompt becoming audience segments.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#273b67"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="36" fill="url(#background)"/>
  <circle cx="1050" cy="130" r="220" fill="#ffffff" opacity=".035"/>
  <circle cx="145" cy="730" r="260" fill="#5ed5ca" opacity=".06"/>
  <text x="90" y="95" fill="#91a4c7" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">YELLOW PANTHER  /  SPORTS INTELLIGENCE</text>
  <text x="90" y="280" fill="#ffffff" font-family="Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-8">ROAR</text>
  <text x="98" y="340" fill="#8fe0d8" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="5">AI FAN SEGMENTATION</text>
  <rect x="90" y="420" width="1020" height="230" rx="28" fill="#ffffff" opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="135" y="480" fill="#aebbd2" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3">DESCRIBE YOUR AUDIENCE</text>
  <rect x="130" y="510" width="635" height="95" rx="16" fill="#ffffff" opacity=".11"/>
  <text x="165" y="570" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">Fans who watched the live stream</text>
  <rect x="800" y="510" width="270" height="95" rx="16" fill="url(#accent)"/>
  <text x="835" y="569" fill="#251d20" font-family="Arial, sans-serif" font-size="24" font-weight="700">CREATE SEGMENT</text>
  <circle cx="1070" cy="725" r="9" fill="#ffb347"/>
  <circle cx="1105" cy="725" r="9" fill="#8fe0d8"/>
</svg>
